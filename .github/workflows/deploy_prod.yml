name: Deploy Prod

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mobistore-front

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_API_URL=https://api.mobistore.uz
            NUXT_PUBLIC_TELEGRAM_BOT_NAME=mobistore_regster_bot
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> $GITHUB_ENV

      - name: Send Telegram notification (start)
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_DEPLOY_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🚀 <b>PROD деплой запущен!</b>

          👤 <b>Разработчик:</b> ${{ github.actor }}
          📦 <b>Проект:</b> MobiStore front
          🌿 <b>Ветка:</b> ${{ github.ref_name }}

          📝 <b>Коммит:</b>
            - ${{ github.event.head_commit.message }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          command_timeout: 5m
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🔄 Running Blue-Green deploy..."
            cd /var/www/mobistore/front
            git fetch origin main
            git reset --hard origin/main

            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh prod

      - name: Send Telegram notification (success)
        if: success()
        run: |
          DEPLOY_END=$(date +%s)
          DEPLOY_TIME=$((DEPLOY_END - DEPLOY_START))
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_DEPLOY_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>PROD деплой успешно завершен!</b>

          📦 <b>Проект:</b> MobiStore front
          🕒 <b>Время:</b> ${DEPLOY_TIME}s

          🎉 Zero downtime deployment!"

      - name: Send Telegram notification (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_DEPLOY_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_DEPLOY_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>PROD деплой завершился с ошибкой!</b>

          📦 <b>Проект:</b> MobiStore front
          👤 <b>Разработчик:</b> ${{ github.actor }}

          ⚠️ Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
